<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon - Pikachu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <nav class="navbar">
                <img src="pokemon.webp" alt="Pokemon Logo" class="logo">
            </nav>

            <div class="content">
                <p class="subtitle">POKEMON GEN I</p>
                <h1 class="title">Pikachu</h1>
                <p class="description">
                    Pikachu is an Electric-type Pok&eacute;mon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pok&eacute;mon.
                    They are almost completely covered by
                    yellow fur.
                </p>
                <div class="pagination">
                    <span class="line"></span>
                    <span class="page-number">01 / 08</span>
                </div>
            </div>

            <div class="pokeball-bg">
                <img src="pokeball.webp" alt="Pokeball" class="pokeball-icon">
            </div>
        </div>

        <div class="right-panel">
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="pikachu-wrapper">
            <img src="pikachu.png" alt="Pikachu" class="pikachu-img">
        </div>
    </div>
</body>
</html>
