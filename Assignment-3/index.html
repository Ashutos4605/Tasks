<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Art Work</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="explore-art">

        
        <div class="header">
            <h2>Explore Art Work</h2>
            <a href="#">See All</a>
        </div>

        
        <div class="art-grid">

            
            <div class="card">
                <div class="image-box">
                    <img src="./mono.png" alt="Monocular">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>Monocular</h3>
                        <span>54.8k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

            
            <div class="card">
                <div class="image-box">
                    <img src="./msk.png" alt="Horns Mask">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>Horns Mask</h3>
                        <span>32.4k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

            
            <div class="card">
                <div class="image-box">
                    <img src="./moon.png" alt="Light Moon">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>Light Moon</h3>
                        <span>86.8k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

          
            <div class="card">
                <div class="image-box">
                    <img src="./wire.png" alt="Skull Wire">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>Skull Wire</h3>
                        <span>78.9k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

         
            <div class="card">
                <div class="image-box">
                    <img src="./dead.png" alt="Spiderman">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>Spiderman</h3>
                        <span>24.8k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

            
            <div class="card">
                <div class="image-box">
                    <img src="./spider.png" alt="DeadPool">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>DeadPool</h3>
                        <span>59.7k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

            
            <div class="card">
                <div class="image-box">
                    <img src="./eye.png" alt="White Eye">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>White Eye</h3>
                        <span>45.7k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="./spinal.png" alt="Plastic Spinal">
                </div>

                <div class="card-content">
                    <div class="title-row">
                        <h3>Plastic Spinal</h3>
                        <span>98.6k ♡</span>
                    </div>

                    <button>Place Bid</button>
                </div>
            </div>

        </div>

    </section>

</body>
</html>
